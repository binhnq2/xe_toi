import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.10.0' apply false
    id 'com.android.library' version '8.10.0' apply false
}

def run(cmd) {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine = cmd
        standardOutput = stdout
    }
    return stdout.toString()
}

// TS8 build host: Git for Windows may be installed per-user rather than in the
// hardcoded machine-wide path. Probe the common locations instead of failing.
String findBash() {
    def candidates = [
        'C:\\Program Files\\Git\\bin\\bash.exe',
        'C:\\Program Files (x86)\\Git\\bin\\bash.exe',
        "${System.getProperty('user.home')}\\AppData\\Local\\Programs\\Git\\bin\\bash.exe",
    ]
    def found = candidates.find { new File(it).exists() }
    if (found == null) {
        throw new GradleException("bash.exe not found for version.sh. Checked: ${candidates}")
    }
    return found
}

def getVersion() {
    def isWindows = DefaultNativePlatform.getCurrentOperatingSystem().isWindows()
    def bash = isWindows ? findBash() : 'bash'
    def versionCode = Integer.parseInt(run([bash, '../tools/unix/version.sh', 'android_code']).trim())
    def versionName = run([bash, '../tools/unix/version.sh', 'android_name']).trim()
    return new Tuple2(versionCode, versionName)
}

rootProject.ext {
    def ver = getVersion()
    versionCode = ver.V1
    versionName = ver.V2
}
